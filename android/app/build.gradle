plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'city.tavana.app'
    compileSdk 34

    defaultConfig {
        applicationId "city.tavana.app"
        minSdk 24
        targetSdk 34
        versionCode 120
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Multi-language locales support
        resourceConfigurations += ['fa', 'en', 'ar', 'es', 'zh', 'hi', 'ru']
    }

    signingConfigs {
        release {
            // Configured via environment variables for CI/CD automation
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "tavana-release-key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "tavana_release_pass"
            keyAlias System.getenv("KEY_ALIAS") ?: "tavana"
            keyPassword System.getenv("KEY_PASSWORD") ?: "tavana_release_pass"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    // Modern Android App Bundle (AAB) splitting configurations for Google Play
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    
    // Accessibility Services and TalkBack Helper
    implementation 'androidx.core:core-role:1.0.0'
    implementation 'androidx.customview:customview-poolingcontainer:1.0.0'
}
